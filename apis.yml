apis:
- name: Cypress Cloud Data Extract API
  description: >-
    Enterprise reporting API that returns test and run analytics and raw
    test-result data from Cypress Cloud. Requests are HTTP GET with an
    organization API key passed as the token query parameter, and data is
    returned as CSV, JSON, or XLSX filtered by report_id, date range, projects,
    and branch.
  humanURL: https://docs.cypress.io/cloud/integrations/data-extract-api
